    <!-- page Header -->
    <div class="page-header">
      <div class="text-grp">
        <h1>Tasks<span id="count-badge"></span></h1>
        <p>all your tasks in one place</p>
      </div>
      <button class="btn primary" id="add-task">add new task</button>
    </div>

    <!-- board -->
    <div class="board">
      <div class="column hidden">
        <div class="col-header">
          <h2 class="col-header-text">column header</h2>
          <button class="btn-icon-only secondary hidden">+</button>
        </div>
        <div class="card">
          <div>
            <h3>Get Back To Studying</h3>
            <p>
              For a Kanban board, the status names depend on how detailed your
              workflow is. Here are some common patterns.
            </p>
          </div>
          <div>
            <p>6 jul, 2026</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Form -->
    <dialog class="add-modal" id="add-modal">
      <div class="modal-header">
        <h2>Add Task</h2>
        <button class="btn danger btn-icon-only small" id="close-add-modal">
          <svg class="icon" viewBox="0 0 24 24" fill="none">
            <use href="#img-x-close"></use>
          </svg>
        </button>
      </div>
      <form action="#" method="post" id="add-form" class="modal-body">
        <p class="field">
          <label for="task_name">task name</label>
          <input
            type="text"
            id="task_name"
            name="task_name"
            placeholder="A cool task name..."
            required
          />
        </p>
        <div class="input-row">
          <p class="field">
            <label for="due_date">due date</label>
            <input type="date" id="due_date" name="due_date" />
          </p>
          <p class="field">
            <label for="task_priority">priority</label>
            <select id="task_priority" name="task_priority">
              <option value="high">high</option>
              <option value="medium" selected>medium</option>
              <option value="low">low</option>
            </select>
          </p>
        </div>
        <p class="field">
          <label for="task_description">task description</label>
          <textarea id="task_description" rows="5" cols="5">
A short task description goes here...</textarea
          >
        </p>
        <button type="submit" class="btn primary">Add Task</button>
      </form>
    </dialog>
    <script src="script.js"></script>
  </body>
</html>
